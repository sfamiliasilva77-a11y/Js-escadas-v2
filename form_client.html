{% extends 'base.html' %}{% block content %}<h1>Novo cliente</h1><form method="post" class="card p-4"><div class="row g-3">{% for n,l in [('name','Nome'),('phone','Telefone / WhatsApp'),('email','E-mail'),('city','Cidade'),('address','Endereço')] %}<div class="col-md-6"><label class="form-label">{{l}}</label><input name="{{n}}" class="form-control" {% if n=='name' %}required{% endif %}></div>{% endfor %}<div class="col-12"><label class="form-label">Observações</label><textarea name="notes" class="form-control"></textarea></div><div><button class="btn btn-success">Salvar</button> <a href="/clients" class="btn btn-outline-secondary">Cancelar</a></div></div></form>{% endblock %}

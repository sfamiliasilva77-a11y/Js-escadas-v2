{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-4"><div><h1>Clientes</h1><p class="text-secondary">Cadastro e histórico.</p></div><a class="btn btn-success" href="/clients/new">＋ Novo cliente</a></div><form class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" name="q" value="{{q}}" placeholder="Buscar por nome, telefone ou cidade"></div><div class="col-auto"><button class="btn btn-outline-secondary">Buscar</button></div></form><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Nome</th><th>WhatsApp</th><th>Cidade</th><th>Endereço</th><th></th></tr>{% for x in rows %}<tr><td><a href="/clients/{{x.id}}">{{x.name}}</a></td><td>{{x.phone or '-'}}</td><td>{{x.city or '-'}}</td><td>{{x.address or '-'}}</td><td>{% if x.phone %}<a class="btn btn-sm btn-outline-success" href="/whatsapp/{{x.id}}">WhatsApp</a>{% endif %}</td></tr>{% else %}<tr><td colspan="5">Nenhum cliente.</td></tr>{% endfor %}</table></div></div>{% endblock %}

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><title>JS Escadas</title></head><body class="bg-light"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-4"><div class="card p-4 shadow-sm"><div class="fs-3 fw-bold">JS ESCADAS</div><p class="text-secondary">Acesso ao sistema V2</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input name="email" type="email" class="form-control mb-2" placeholder="E-mail" required><input name="password" type="password" class="form-control mb-3" placeholder="Senha" required><button class="btn btn-success w-100">Entrar</button></form><small class="text-secondary d-block mt-3">Acesso inicial: admin@jsescadas.com / 1234</small></div></div></div></div></body></html>

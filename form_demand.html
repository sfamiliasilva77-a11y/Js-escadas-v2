{% extends 'base.html' %}{% block content %}<h1>Nova demanda</h1><form method="post" class="card p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Cliente</label><select name="client_id" class="form-select" required>{% for x in clients %}<option value="{{x.id}}">{{x.name}}</option>{% else %}<option disabled>Nenhum cliente cadastrado</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Tipo</label><select name="service_type" class="form-select">{% for x in service_types %}<option>{{x}}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Valor estimado</label><input name="value" type="number" step="0.01" class="form-control"></div><div class="col-md-6"><label class="form-label">Medidas</label><input name="measurements" class="form-control" placeholder="Ex.: 2,80m x 0,90m"></div><div class="col-12"><label class="form-label">Descrição</label><textarea name="description" class="form-control" rows="4"></textarea></div><div class="col-md-5"><label class="form-label">Status</label><select name="status" class="form-select"><option>Novo</option><option>Orçamento</option><option>Aguardando resposta</option></select></div><div><button class="btn btn-success">Salvar demanda</button> <a href="/demands" class="btn btn-outline-secondary">Cancelar</a></div></div></form>{% endblock %}

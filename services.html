{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-4"><div><h1>Serviços</h1><p class="text-secondary">Agenda e execução.</p></div><a class="btn btn-success" href="/services/new">＋ Agendar serviço</a></div><div class="card p-3"><div class="table-responsive"><table class="table"><tr><th>Data</th><th>Horário</th><th>Cliente</th><th>Serviço</th><th>Equipe</th><th>Status</th></tr>{% for x in rows %}<tr><td>{{x.date}}</td><td>{{x.time or '-'}}</td><td>{{x.client}}</td><td>{{x.service_type}}</td><td>{{x.team or '-'}}</td><td><form method="post" action="/services/{{x.id}}/status"><select name="status" class="form-select form-select-sm" onchange="this.form.submit()">{% for s in ['Agendado','Em execução','Concluído','Cancelado'] %}<option {% if x.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></form></td></tr>{% else %}<tr><td colspan="6">Nenhum serviço.</td></tr>{% endfor %}</table></div></div>{% endblock %}

{% extends 'base.html' %}{% block content %}<h1>Agendar serviço</h1><form method="post" class="card p-4"><div class="row g-3"><div class="col-12"><label class="form-label">Demanda aprovada</label><select name="demand_id" class="form-select" required>{% for x in demands %}<option value="{{x.id}}">#{{'%04d'|format(x.id)}} — {{x.client}} — {{x.service_type}}</option>{% else %}<option disabled>Nenhuma demanda aprovada</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Data</label><input name="date" type="date" value="{{today}}" class="form-control" required></div><div class="col-md-4"><label class="form-label">Horário</label><input name="time" type="time" class="form-control"></div><div class="col-md-4"><label class="form-label">Equipe</label><input name="team" class="form-control"></div><div class="col-12"><label class="form-label">Endereço</label><input name="address" class="form-control"></div><div class="col-12"><label class="form-label">Observações</label><textarea name="notes" class="form-control"></textarea></div><div><button class="btn btn-success">Agendar</button> <a href="/services" class="btn btn-outline-secondary">Cancelar</a></div></div></form>{% endblock %}

{% extends 'base.html' %}{% block content %}<h1>Novo orçamento</h1><p class="text-secondary">O número é gerado automaticamente.</p><form method="post" class="card p-4"><div class="row g-3"><div class="col-12"><label class="form-label">Demanda</label><select name="demand_id" class="form-select" required>{% for x in demands %}<option value="{{x.id}}">#{{'%04d'|format(x.id)}} — {{x.client}} — {{x.service_type}}</option>{% else %}<option disabled>Nenhuma demanda disponível</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Subtotal</label><input name="subtotal" id="subtotal" type="number" step="0.01" class="form-control" required></div><div class="col-md-4"><label class="form-label">Desconto</label><input name="discount" id="discount" type="number" step="0.01" value="0" class="form-control"></div><div class="col-md-4"><label class="form-label">Total</label><input id="total" class="form-control" readonly></div><div class="col-12"><label class="form-label">Descrição</label><textarea name="description" class="form-control"></textarea></div><div class="col-12"><label class="form-label">Condições</label><textarea name="terms" class="form-control">Parcelamos em 4x sem juros. Valor à vista em dinheiro ou Pix pode ser negociado.</textarea></div><div><button class="btn btn-success">Criar orçamento</button> <a href="/quotes" class="btn btn-outline-secondary">Cancelar</a></div></div></form><script>function calc(){let s=parseFloat(subtotal.value)||0,d=parseFloat(discount.value)||0;total.value=(Math.max(s-d,0)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}subtotal.oninput=discount.oninput=calc;calc()</script>{% endblock %}
